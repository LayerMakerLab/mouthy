[package]
name = "mouthy-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mouthy for Windows and Linux: local dictation with Parakeet and Whisper"

[[bin]]
name = "mouthy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mouthy-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-rs = { version = "0.6", features = ["download-binaries"] }
cpal = "0.15"
arboard = { version = "3", features = ["wayland-data-control"] }
tiny_http = "0.12"
hound = "3"
ureq = { version = "2", features = ["json"] }
bzip2 = "0.4"
tar = "0.4"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
parking_lot = "0.12"
hmac = "0.12"
sha2 = "0.10"

[target.'cfg(not(target_os = "linux"))'.dependencies]
enigo = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6", default-features = false, features = ["x11rb"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_UI_Accessibility", "Win32_System_Ole", "Win32_System_Variant"] }
